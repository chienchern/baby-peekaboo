<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peekaboo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peekaboo">
<meta name="theme-color" content="#bfe6ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ Start screen ============ -->
<section id="start">
  <h1 id="title">Peekaboo</h1>

  <div id="desktopnote" hidden>
    <p><b>&#x1F4F1; Made for phones and tablets.</b></p>
    <p>Open this page on a phone or tablet:<br><span id="pageurl"></span></p>
    <button id="anyway" class="link">Try it here with a mouse anyway</button>
  </div>

  <div id="setcards"></div>

  <p id="voicenote" hidden>
    &#x1F507; Names aren't spoken in this version. Little ones learn best from a voice they know,
    so the names are meant to be recorded by a parent in their own copy of the game
    (see the project's README on GitHub).
  </p>

</section>

<!-- ============ Game ============ -->
<section id="game" hidden>
  <div id="board"></div>
  <button id="home" class="corner left hold" title="Press and hold to go back">&#x2302;</button>
  <button id="restart" class="corner right" title="New round">&#x21bb;</button>
  <canvas id="confetti"></canvas>
</section>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
